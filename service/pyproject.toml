[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramaclip"
version = "2.0.0"
description = "DramaClip 本地服务（分析/解说/字幕/消重/TTS/存储）"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  # edge-tts：片头解说旁白合成（云端免费，无需本地模型；登记理由见 docs/04 准入制）
  "edge-tts>=7.0",
  # jieba：OCR 字幕热词挖掘（全剧高频专名 → ASR hotwords 事前注入）
  "jieba>=0.42",
]

[project.optional-dependencies]
# 依赖准入制（docs/04 质量规约）：重依赖随阶段逐个登记理由
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# ML 运行时（分析/解说/TTS 全功能；torch 默认 CPU 轮子，GPU 见 build-service --cuda）
ml = [
  "numpy>=2.0",
  "faster-whisper>=1.2",
  "ctranslate2>=4.5",
  "scenedetect>=0.7",
  "librosa>=0.10",
  "soundfile>=0.13",
  "torch>=2.2",
  "transformers>=4.40",
  "kokoro>=0.7",
  "misaki>=0.7",
  "rapidocr-onnxruntime>=1.3",
  "funasr>=1.1",
  "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
dramaclip-service = "dramaclip.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dramaclip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# 第三方无类型库按模块登记放宽（docs/04 第 2 节），禁止全局降 strict
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "funasr.*",
  "kokoro.*",
  "librosa.*",
  "rapidocr_onnxruntime.*",
  "scenedetect.*",
  "soundfile.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
