[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramaclip"
version = "0.2.2"
description = "DramaClip 本地服务（分析/解说/字幕/消重/TTS/存储）"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  # edge-tts：片头解说旁白合成（云端免费，无需本地模型；登记理由见 docs/04 准入制）
  "edge-tts>=7.0",
  # jieba：OCR 字幕热词挖掘（全剧高频专名 → ASR hotwords 事前注入）
  "jieba>=0.42",
  # pypinyin：转写精炼的拼音护栏（同音/近音校验，防 LLM 幻觉改写）
  "pypinyin>=0.53",
]

[project.optional-dependencies]
# 依赖准入制（docs/04 质量规约）：重依赖随阶段逐个登记理由
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# ML 运行时（E-2 后主 venv 零 torch：funasr/kokoro 的 torch 系在本地智能运行
# 环境 tts-venv 的 worker 进程执行，依赖清单见 infra/model_manager/tts_runtime.py；
# 本组只剩主进程自身跑的：whisper/检测/音频/OCR）
ml = [
  "numpy>=2.0",
  "faster-whisper>=1.2",
  # av 上界：faster-whisper 1.2 的 decode_audio 依赖 av.open(metadata_errors=)，
  # av 14 起移除该参数导致转写开场即崩（2026-10-13 真机：分析任务卡 analyzing）
  "av<14",
  "ctranslate2>=4.5",
  "scenedetect>=0.7",
  "librosa>=0.10",
  "soundfile>=0.13",
  "rapidocr>=3.10",
  "onnxruntime>=1.18",
  "opencc-python-reimplemented>=0.1.7",
  # 云端 ASR 适配器（dashscope_cloud）的运行时依赖：此前只在本机 ad-hoc 安装，
  # CI 打的安装包没带上它（v0.2.2 首次 CI 打包实证）——真机 1.27.7 验收版
  "dashscope>=1.27.7",
]
# dev 进程内分支的事实依赖（torch/funasr/kokoro）：E-2 后「主 venv 零 torch」是
# **打包态**契约；dev/测试态的进程内 ASR/TTS 回退分支仍 import 这三样。不声明
# 就等于「本机侥幸」——新机器按清单装齐后测试照挂（v0.2.2 CI 六轮揭雷的根源）。
# 版本下界 = 真机验收版；torch 的 +cu126 变体由装机命令的 --index-url 决定。
devml = [
  "torch>=2.8",
  "funasr>=1.4.16",
  "kokoro>=0.9.4",
]

[project.scripts]
dramaclip-service = "dramaclip.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dramaclip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# scriptwriter 与 tools/* 的主体是中文提示词/夹具数据（内容即数据，行长不是
# 代码行长；折行会改发往 LLM 的字节，宁可不折）。
"**/narration/scriptwriter.py" = ["E501"]
"tools/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# 第三方无类型库按模块登记放宽（docs/04 第 2 节），禁止全局降 strict
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "cv2",
  "cv2.*",
  "faster_whisper.*",
  "funasr.*",
  "kokoro.*",
  "librosa",
  "librosa.*",
  "rapidocr.*",
  "scenedetect.*",
  "soundfile.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
