[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dramaclip-backend"
version = "1.0.0"
description = "DramaClip 短剧自动高光剪辑系统 - Python 后端"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["video", "highlight", "clip", "ai", "tts", "asr"]

dependencies = [
    # ----- 核心依赖 -----
    "requests>=2.32.0",
    "moviepy>=2.1.1,<3",
    "edge-tts>=7.2.7,<8",
    "watchdog>=6.0.0,<7",
    "loguru>=0.7.3",
    "tomli>=2.2.1",
    "tomli-w>=1.0.0",
    "pydub>=0.25.1,<1",
    "pysrt>=1.1.2,<2",
    "Pillow>=10.3.0,<12.0",
    "tqdm>=4.66.6",
    "tenacity>=9.0.0",
    "pydantic>=2.0",
    # ----- AI 服务依赖 -----
    "openai>=1.77.0,<2.0.0",
    "google-generativeai>=0.8.5",
    "azure-cognitiveservices-speech>=1.37.0",
    "tencentcloud-sdk-python>=3.0.1200",
    # ----- 高光分析核心依赖 -----
    "scenedetect>=0.7",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "opencv-python>=4.11.0.86",
    "jieba>=0.42.1",
    # ----- 可选（本地语音识别 / CUDA 加速） -----
    "faster-whisper>=1.0.1",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    # 测试
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    # 代码质量
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    # 类型检查
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    # 开发工具
    "ipython>=8.12.0",
    "ipdb>=0.13.0",
]
cosyvoice = [
    "funasr",
    "modelscope",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
dramaclip-backend = "app.backend_main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
norecursedirs = [
    "reference",
    "pretrained_models",
    "app/pretrained_models",
    "resources",
    ".venv",
    ".venv-tts",
    "node_modules",
    "dist",
    "build",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
