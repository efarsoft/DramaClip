[app]
    project_version="0.1.0"

    # LLM API 超时配置（秒）
    llm_vision_timeout = 120
    llm_text_timeout = 180
    llm_max_retries = 3

    ##########################################
    # 🚀 LLM 配置 - OpenAI 兼容统一接口
    ##########################################

    # ===== 视觉模型配置 =====
    vision_llm_provider = "openai"
    vision_openai_model_name = "Qwen/Qwen2.5-VL-32B-Instruct"
    vision_openai_api_key = ""
    vision_openai_base_url = "https://api.siliconflow.cn/v1"

    # ===== 文本模型配置 =====
    text_llm_provider = "openai"
    text_openai_model_name = "deepseek-ai/DeepSeek-V3"
    text_openai_api_key = ""
    text_openai_base_url = "https://api.siliconflow.cn/v1"

    # 是否隐藏配置项（桌面客户端使用时建议隐藏）
    hide_config = false

##########################################
# TTS (文本转语音) 配置 - AI解说模式使用
##########################################

[azure]
    speech_key = ""
    speech_region = ""

[tencent]
    secret_id = ""
    secret_key = ""
    region = "ap-beijing"

[cosyvoice]
    # CosyVoice TTS (DashScope API) - AI解说模式使用
    # 支持 v3-flash/v3-plus/v2/v1，仅 v3 系列支持情感 Instruct
    api_key = ""
    model = "cosyvoice-v3-flash"
    voice = "longanyang"
    # 情感指令 (仅 v3 + 支持 Instruct 的音色可用，留空则无情感控制)
    # 示例: "用激动的语气说", "带有悲伤的情感", "用温柔亲切的语气"
    instruction = ""

[ui]
    # TTS引擎选择 (styletts2, edge_tts, azure_speech, tencent_tts)
    tts_engine = "styletts2"
    edge_voice_name = "zh-CN-XiaoyiNeural-Female"
    edge_volume = 80
    edge_rate = 1.0
    edge_pitch = 0
    azure_voice_name = "zh-CN-XiaoyiNeural-Female"
    azure_volume = 80
    azure_rate = 1.0
    azure_pitch = 0
    # StyleTTS 2 参数（纯本地情感语音合成）
    # embedding_scale: 情感强度 (0.5-2.0, 默认1.0, 越高越有感情)
    # alpha: 音色适应度 (0.0-1.0, 默认0.3, 越高越偏向文本风格而非参考音色)
    # beta:  韵律适应度 (0.0-1.0, 默认0.7, 越高越偏向文本风格而非参考音色)
    # model_checkpoint: 自定义模型路径 (为空则使用默认预训练模型)
    # config_path: 模型配置文件路径 (为空则使用默认配置)
    styletts2_embedding_scale = 1.0
    styletts2_alpha = 0.3
    styletts2_beta = 0.7
    styletts2_voice = ""
    styletts2_model_checkpoint = ""
    styletts2_config_path = ""

##########################################
# 代理和网络配置
##########################################

[proxy]
    http = ""
    https = ""
    enabled = false

##########################################
# 🎬 DramaClip 高光剪辑核心配置
##########################################

[highlight]
    # 高光打分权重配置
    audio_weight = 0.4       # 音频爆点权重
    emotion_weight = 0.3     # 台词情绪权重
    visual_weight = 0.2      # 画面特征权重
    rhythm_weight = 0.1      # 镜头节奏权重
    
    # 筛选配置
    top_ratio = 0.3          # 选取Top N比例 (0.3 = Top30%)
    min_segment_duration = 2 # 最小片段时长(秒)
    max_segments_per_episode = 5  # 每集最多保留片段数
    min_episodes_covered = 1  # 最少覆盖集数

[output]
    # 默认输出配置
    default_duration = 30    # 默认输出时长(秒)，可选: 15, 30, 45, 60
    resolution = "1080P"      # 输出分辨率
    aspect_ratio = "9:16"     # 宽高比 (竖屏)
    fps = 25                  # 帧率

[scene_detect]
    # PySceneDetect 镜头分割配置
    threshold = 30           # 场景检测阈值
    min_scene_len = 2        # 最小场景长度(秒)
    max_scene_len = 8        # 最大场景长度(秒)

[frames]
    frame_interval_input = 3
    vision_batch_size = 10

##########################################
# 🔧 稳定性配置（重试、超时、并发）
##########################################

[stability]
    # 通用重试配置
    retry_max_attempts = 3        # 最大重试次数
    retry_wait_min = 4            # 最小等待时间(秒)
    retry_wait_max = 30           # 最大等待时间(秒)
    retry_wait_multiplier = 1.0   # 退避乘数

    # API 专用重试配置（更激进的重试策略）
    api_retry_max_attempts = 5
    api_retry_wait_min = 4
    api_retry_wait_max = 60
    api_retry_wait_multiplier = 2.0

    # FFmpeg 超时配置（秒）
    ffmpeg_short_timeout = 30     # 短操作（如查询信息）
    ffmpeg_medium_timeout = 120   # 中等操作（如裁剪）
    ffmpeg_long_timeout = 300     # 长操作（如转码）
    ffmpeg_merge_timeout = 600    # 合并操作

    # 下载超时配置（秒）
    download_connect_timeout = 30  # 连接超时
    download_read_timeout = 60     # 读取超时
    model_download_timeout = 600   # 模型下载超时

    # 视频处理超时配置（秒）
    frame_extract_timeout = 30     # 帧提取超时
    scene_detect_timeout = 120     # 场景检测超时

    # 并发限制
    max_concurrent_downloads = 3   # 最大并发下载数
    max_concurrent_analyses = 2    # 最大并发分析数
