name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 自动代码审查
  code-review:
    name: Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8
          pip install radon

      - name: Run code complexity analysis
        run: |
          radon cc app/ -a -s

      - name: Check code style
        run: |
          flake8 app/ --count --max-line-length=120 --statistics

      - name: Add review comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Code Review Checklist\n\n- [ ] 代码遵循项目风格指南\n- [ ] 有适当的单元测试\n- [ ] 没有硬编码的敏感信息\n- [ ] 错误处理完善\n- [ ] 性能考虑周全\n- [ ] 文档已更新（如有必要）\n\n---\n_Generated by GitHub Actions_'
            })

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          baseDepth: 10
          maxDepth: 5
