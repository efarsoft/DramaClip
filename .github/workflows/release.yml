name: Release

# tag 推送（v*）→ 构建 Windows 安装包（sidecar + electron-builder）→ 发布 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Windows 客户端
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 版本防呆：tag 必须与 desktop/package.json 一致（electron-builder 以它命名产物）
      - name: 校验 tag 与版本一致
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 desktop/package.json 版本 ${PKG_VERSION} 不一致"
            exit 1
          fi

      # 行帽棘轮（W13）：函数 120/文件 800 只降不升——发版前最后防线（CI 侧已有同款）。
      # 该测试只做 AST 扫描、零项目依赖，所以完全脱离项目环境跑：
      # - uv 不在 runner 预装清单里，须先装；
      # - --no-project 不去同步项目环境（pytest 声明在可选组 dev 里，默认同步里没有）；
      # - --noconftest 跳过 tests/conftest.py（它一加载就要导入整套引擎）。
      # 实测教训（2026-11-24）：原写法 `uv --directory service run pytest …` 即使装了 uv
      # 也会死在 conftest 的 ModuleNotFoundError 上——这一步此前从未在真实发版里跑过。
      - name: 安装 uv
        run: python -m pip install uv
      - name: 行帽棘轮校验
        run: >-
          uv run --no-project --with "pytest>=8" pytest --noconftest
          service/tests/infra/test_line_budget.py

      # dist:service 硬编码 .venv\Scripts\python.exe，此处先建同名 venv；
      # PyInstaller 与本机开发环境钉同版（6.22.2）——PYZ 断言方法论绑它的归档形状
      - name: 建 Python venv 并安装 ML 依赖
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/pip.exe install -e 'service[ml]' 'pyinstaller==6.22.2'

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 打包 Python sidecar
        run: npm run dist:service

      - name: sidecar 冒烟验证
        run: node scripts/verify_sidecar.mjs

      # electron 包的 postinstall 在 npm 11.19 安装脚本新策略下不保证执行
      # （electronDist 缺失实证）：显式跑一次 install.js，已就位则幂等跳过
      - name: 就位 Electron 预编译产物
        shell: bash
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 仅 electron-builder（sidecar 已在上一步打包完成）
      - name: 打包安装包（NSIS + zip）
        run: npm run dist --workspace @dramaclip/desktop
        env:
          # CI 用 GitHub 官方源下载 Electron 二进制（覆盖 .npmrc 的国内镜像）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 发布说明统一维护在仓库根 upgrade.md；body_path 只吃纯文本——顶部小节
      # （首个 ^## v 到下一个 ^## v 之前）先提取成独立文件，整文件会带上旧版本
      - name: 提取顶部版本小节作为发布正文
        shell: bash
        run: awk '/^## v/{c++} c==2{exit} c>=1{print}' upgrade.md > release-body.md

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DramaClip ${{ github.ref_name }}
          draft: true
          body_path: release-body.md
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
