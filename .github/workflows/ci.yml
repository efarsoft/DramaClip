name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: desktop + protocol（lint / typecheck / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  service:
    name: service（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # torch 预装 CPU 轮子（PyPI linux 默认轮子含 CUDA 栈，多 2GB 下载）
      - name: 安装依赖（ml + dev，torch 走 CPU 轮子）
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[ml,dev]'
      # 测试夹具用真 ffmpeg 生成样片：解析器 resources→PATH，Linux 上落 PATH
      - name: 安装 ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ruff check .
      - run: mypy dramaclip
      - run: python -m pytest -x -q
