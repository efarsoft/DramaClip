name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: desktop + protocol（lint / typecheck / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # TODO(W1 后): 锁文件入库后改为 npm ci
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  service:
    name: service（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy dramaclip
      - run: python -m pytest
