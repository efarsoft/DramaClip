appId: com.dramaclip.app
productName: DramaClip
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
extraResources:
  # 打包 Python 后端
  - from: dist/backend/
    to: backend/
    filter:
      - "**/*"
  # 打包 FFmpeg（安装后开箱即用）
  - from: resources/ffmpeg.exe
    to: backend/resources/ffmpeg.exe
  - from: resources/ffprobe.exe
    to: backend/resources/ffprobe.exe
asar: true
asarUnpack:
  - "**/*.exe"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DramaClip
extraMetadata:
  main: dist-electron/main/app.js
publish: null
