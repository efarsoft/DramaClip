# electron-builder 打包配置（W14）：
# - asar 内：渲染层 dist/ + 主进程/preload dist-electron/
# - asar 外（extraResources → resources/app-resources/）：
#   白名单运行时目录（ffmpeg/fonts/自检样例/预设/解说风格 + sidecar dramaclip-service/）
#   模型一律不随包，引擎中心按需下载
#   主进程经 process.resourcesPath/app-resources 定位，并注入 DRAMACLIP_RESOURCES_DIR
appId: com.dramaclip.desktop
productName: DramaClip
directories:
  output: release
  buildResources: build
asar: true
# 复用 npm 已下载的 electron 二进制：跳过 zip 解压——新解压文件常被杀软
# 实时扫描持锁，staging 目录 rename 稳定 EPERM（真实事故 ×2）
electronDist: ../node_modules/electron/dist
files:
  - dist/**
  - dist-electron/**
  # 界面字体由 Vite 从 src/assets/fonts 解析进 dist 随包；两份 OFL 许可文本不被代码
  # 引用、Vite 不会带它们，须在此显式列入——OFL 1.1 要求分发字体必须附带许可文本。
  # 门禁：src/__tests__/cssContract.test.ts
  - src/assets/fonts/OFL-*.txt
# 白名单显式列出运行时目录——禁止 **/* 全拷：将来谁在 resources/ 下放了
# 模型/缓存（手册指引的手动导入是放 data/models，但保不齐有人放错），都不许混进安装包。
# 模型一律走引擎中心按需下载，不随包。
extraResources:
  - { from: ../resources/ffmpeg, to: app-resources/ffmpeg }
  - { from: ../resources/fonts, to: app-resources/fonts }
  - { from: ../resources/face-detect, to: app-resources/face-detect }
  - { from: ../resources/selftest, to: app-resources/selftest }
  - { from: ../resources/subtitle-presets, to: app-resources/subtitle-presets }
  - { from: ../resources/narration-styles, to: app-resources/narration-styles }
  # CI 先跑 dist:service 产出到 resources/dramaclip-service（gitignored），此处随包
  - { from: ../resources/dramaclip-service, to: app-resources/dramaclip-service }
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DramaClip
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
