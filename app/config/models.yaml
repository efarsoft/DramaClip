# DramaClip — Model Catalog (Minimal Set)
#
# This is the single source of truth for all downloadable models.
# Loaded at startup by model_manager.load_model_catalog().
#
# Default download channel: ModelScope (国内首选，速度快、免翻墙)
#   - 用户可在「模型管理」页面切换为 HuggingFace
#
# Minimal set rationale:
#   - ASR:  SenseVoiceSmall (中文短剧最优，支持方言/情感/BGM，~0.9 GB)
#   - TTS:  Kokoro-82M (超轻量本地兜底，~150 MB) + edge_tts (云端默认，零开销)
#   - Diar: 内置聚类算法（无需额外模型），pyannote 作为可选引擎保留代码路径但不在目录中
#
# Fields:
#   repo_id    (required) — HuggingFace / ModelScope repository ID
#   label      (required) — Human-readable display name (shown in UI)
#   role       (required) — TTS | ASR
#   size_gb    (required) — Approximate download size in GiB
#   category   (optional) — tts / asr
#   note       (optional) — Important notes for user
#   required   (optional) — true if core functionality depends on it

models:
  # ── ASR (语音识别) ──────────────────────────────────────────────────────
  - repo_id: "iic/SenseVoiceSmall"
    label: "SenseVoice Small (中文方言/情感/BGM识别)"
    role: ASR
    size_gb: 0.9
    category: asr
    note: "阿里达摩院出品，中文短剧场景首选。支持方言、情绪检测、BGM识别。优先从 ModelScope 下载。"
    required: true

  # ── TTS (语音合成) ──────────────────────────────────────────────────────
  - repo_id: "hexgrad/Kokoro-82M-v1.1-zh"
    label: "Kokoro-82M v1.1 中文 (超轻量本地兜底)"
    role: TTS
    size_gb: 0.15
    category: tts
    note: "仅 82M 参数，推理极快。本地离线 TTS 兜底方案，默认 TTS 引擎为 edge_tts (云端)。"
